services:
  iam-api:
    build:
      context: .
      dockerfile: src/Services/IAM/IAM.Api/Dockerfile
    image: connecting-iam-api:latest
    container_name: connecting-iam-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=iam-db;Database=${IAM_POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__ExchangeName=connecting_events
      - RabbitMQ__QueueName=iam_service_queue
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpirationMinutes=${JWT_EXPIRATION_MINUTES}
    ports:
      - "5001:8080"
    depends_on:
      iam-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - connecting-network
    restart: unless-stopped

  iam-db:
    image: postgres:15-alpine
    container_name: connecting-iam-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${IAM_POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    networks:
      - connecting-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  experience-api:
    build:
      context: .
      dockerfile: src/Services/Experience/Experience.Api/Dockerfile
    image: connecting-experience-api:latest
    container_name: connecting-experience-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=experience-db;Database=${EXPERIENCE_POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5002:8080"
    depends_on:
      experience-db:
        condition: service_healthy
    networks:
      - connecting-network
    restart: unless-stopped

  experience-db:
    image: postgis/postgis:16-3.4-alpine
    container_name: connecting-experience-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${EXPERIENCE_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - experience_postgres_data:/var/lib/postgresql/data
    networks:
      - connecting-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  user-api:
    build:
      context: .
      dockerfile: src/Services/User/User.Api/Dockerfile
    image: connecting-user-api:latest
    container_name: connecting-user-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Host=user-db;Database=${USER_POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__ExchangeName=connecting_events
      - RabbitMQ__QueueName=user_service_queue
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpirationMinutes=${JWT_EXPIRATION_MINUTES}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    ports:
      - "5003:8080"
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - connecting-network
    restart: unless-stopped

  user-db:
    image: postgres:15-alpine
    container_name: connecting-user-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    networks:
      - connecting-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  notification-service:
    build:
      context: .
      dockerfile: src/Services/Notification/Dockerfile
    image: connecting-notification-service:latest
    container_name: connecting-notification-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__ExchangeName=connecting_events
      - RabbitMQ__QueueName=notification_service_queue
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__FromAddress=${SMTP_FROM_ADDRESS}
      - Email__VerificationUrlTemplate=${FRONTEND_URL}/auth/verify-email?token={token}
      - Email__ResetUrlTemplate=${FRONTEND_URL}/auth/reset-password?token={token}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - connecting-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: connecting-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - connecting-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: src/APIGateway/Dockerfile
    image: connecting-gateway:latest
    container_name: connecting-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ReverseProxy__Clusters__iam-cluster__Destinations__destination1__Address=http://iam-api:8080
      - ReverseProxy__Clusters__experience-cluster__Destinations__destination1__Address=http://experience-api:8080
      - ReverseProxy__Clusters__user-cluster__Destinations__destination1__Address=http://user-api:8080
    ports:
      - "5000:8080"
    depends_on:
      - iam-api
      - experience-api
      - user-api
      - notification-service
    networks:
      - connecting-network
    restart: unless-stopped

volumes:
  iam_postgres_data:
    driver: local
  experience_postgres_data:
    driver: local
  user_postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  connecting-network:
    driver: bridge
